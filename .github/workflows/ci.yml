name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (fast suite)
        run: uv run pytest -v -m "not slow"

      - name: Smoke test CLI entrypoint
        run: uv run agentcad --help

      - name: Batch validation smoke test
        run: |
          cd /tmp && mkdir batch-smoke && cd batch-smoke
          uv run --project $GITHUB_WORKSPACE agentcad init batch_demo
          cd batch_demo
          uv run --project $GITHUB_WORKSPACE agentcad build batch_demo
          uv run --project $GITHUB_WORKSPACE agentcad validate all