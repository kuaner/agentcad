name: Slow Tests

on:
  schedule:
    - cron: "0 3 * * *"  # daily at 03:00 UTC
  workflow_dispatch:      # manual trigger

jobs:
  slow-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run slow tests
        run: uv run pytest -v -m slow

      - name: Batch validation on fan-adapter-8025
        run: |
          cd $GITHUB_WORKSPACE/examples/fan-adapter-8025
          uv run --project $GITHUB_WORKSPACE agentcad validate all